name: Verify and package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/entitasale170925]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify
        run: npm run verify
      - name: Audit high severity
        run: npm audit --audit-level=high
      - name: Package portable desktop
        run: npm run package:desktop
      - name: Smoke packaged desktop
        run: .\Dudidam-Desktop\Dudidam.exe --ci-smoke
      - name: Build assisted Windows installer
        run: npm run package:installer
      - name: Validate installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "Dudidam-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer Dudidam tidak ditemukan." }
          if ($installer.Length -lt 1000000) { throw "Installer Dudidam terlalu kecil dan kemungkinan tidak lengkap." }
          Write-Host "Installer ready: $($installer.FullName) ($($installer.Length) bytes)"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build portable desktop
        run: npm run package:desktop
      - name: Build installer
        run: npm run package:installer
      - name: Prepare release files
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $zip = "release\Dudidam-Portable-$version-x64.zip"
          Compress-Archive -Path "Dudidam-Desktop\*" -DestinationPath $zip -Force
          Write-Host "Portable package: $zip"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $installer = Get-ChildItem release -Filter "Dudidam-Setup-*-x64.exe" | Select-Object -First 1
          $zip = Get-ChildItem release -Filter "Dudidam-Portable-*-x64.zip" | Select-Object -First 1
          if (-not $installer -or -not $zip) { throw "File rilis tidak lengkap." }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "Dudidam $tag" --notes "Installer Windows x64 dan paket portable Dudidam yang sudah melewati test, audit dependency, packaging, dan smoke test Electron."
          }
          gh release upload $tag $installer.FullName $zip.FullName --clobber

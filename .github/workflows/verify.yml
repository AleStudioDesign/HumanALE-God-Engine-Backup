name: Verify and package

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish legacy Windows artifacts from the default backup branch (requires explicit operator review)"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main, codex/ale-hologram-gpt-starter/dudidam-neural-avatar]
  push:
    branches: [main, codex/entitasale170925, codex/ale-hologram-gpt-starter/dudidam-neural-avatar]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify
        run: npm run verify
      - name: Smoke interactive Windows terminal
        run: npm run smoke:terminal
      - name: Audit high severity
        run: npm audit --audit-level=high
      - name: Package portable desktop
        run: npm run package:desktop
      - name: Smoke packaged desktop
        shell: pwsh
        run: |
          $smoke = Start-Process -FilePath '.\HumanALE-God-Engine-Desktop\HumanALE-God-Engine.exe' -ArgumentList '--ci-smoke' -PassThru -Wait -WindowStyle Hidden
          if ($smoke.ExitCode -ne 0) { throw "Packaged desktop smoke failed with exit code $($smoke.ExitCode)." }
      - name: Build assisted Windows installer
        run: npm run package:installer
      - name: Validate installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "HumanALE-God-Engine-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer HumanALE god egine tidak ditemukan." }
          if ($installer.Length -lt 1000000) { throw "Installer HumanALE god egine terlalu kecil dan kemungkinan tidak lengkap." }
          Write-Host "Installer ready: $($installer.FullName) ($($installer.Length) bytes)"

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/codex/ale-hologram-gpt-starter/dudidam-neural-avatar'
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build portable desktop
        run: npm run package:desktop
      - name: Build installer
        run: npm run package:installer
      - name: Prepare release files
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $zip = "release\HumanALE-God-Engine-Portable-$version-x64.zip"
          Compress-Archive -Path "HumanALE-God-Engine-Desktop\*" -DestinationPath $zip -Force
          Write-Host "Portable package: $zip"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $installer = Get-ChildItem release -Filter "HumanALE-God-Engine-Setup-*-x64.exe" | Select-Object -First 1
          $zip = Get-ChildItem release -Filter "HumanALE-God-Engine-Portable-*-x64.zip" | Select-Object -First 1
          if (-not $installer -or -not $zip) { throw "File rilis tidak lengkap." }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "HumanALE god egine $tag" --notes "Installer Windows x64 dan paket portable HumanALE god egine yang sudah melewati test, audit dependency, packaging, dan smoke test Electron."
          }
          gh release upload $tag $installer.FullName $zip.FullName --clobber

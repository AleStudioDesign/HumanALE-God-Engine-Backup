name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "capacitor.config.json"
      - "scripts/prepare-android.mjs"
      - ".github/workflows/android-apk.yml"
      - "build.mjs"
      - "package.json"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install project dependencies
        run: npm ci

      - name: Verify web app
        run: npm run verify

      - name: Build web assets
        run: npm run build

      - name: Install Capacitor Android tooling
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Generate Android project
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Validate APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test $(stat -c%s "$APK") -gt 1000000
          mkdir -p release
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          cp "$APK" "release/HumanALE-Android-$SHORT_SHA.apk"
          ls -lh release/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HumanALE-Android-APK
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-latest"
          APK=$(ls release/HumanALE-Android-*.apk | head -n 1)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "HumanALE Android APK" --notes "APK Android debug-installable terbaru HumanALE. Dibangun otomatis dari branch main."
          gh release edit "$TAG" --target "$GITHUB_SHA" --title "HumanALE Android APK" --notes "APK Android debug-installable terbaru HumanALE. Dibangun otomatis dari branch main."
          gh release upload "$TAG" "$APK#HumanALE-Android.apk" --clobber
